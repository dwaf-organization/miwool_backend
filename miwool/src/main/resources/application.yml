    suffix: .html
    mode: HTML
    encoding: UTF-8
    cache: false
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://mongsom.cf6og1l7mjlg.ap-northeast-2.rds.amazonaws.com:3306/miwool
    password: "dwaf8083!!"
    username: admin
  task:
    scheduling:
